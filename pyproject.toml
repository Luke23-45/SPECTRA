[project]
name = "spectra-mtl"
version = "1.0.0"
description = "SPECTRA: Frequency-Decoupled Manifolds and Projected Bayesian Scaling for Massive Multi-Task Learning"
authors = [
    {name = "Luke Green"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "huggingface-hub>=0.19.0",
    "hydra-core>=1.3.0",
    "lmdb>=1.4.1",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytorch-lightning>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.12.0",
    "torch>=2.1.0",
    "torchmetrics>=1.2.0",
    "torchvision>=0.16.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spectra"]
