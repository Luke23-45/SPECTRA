defaults:
  - dataset: synthetic
  - method: pcgrad
  - _self_
  - optional preset: null

method_name: "${method.name}"
run_name: "${method_name}_${dataset_name}_s${seed}"
seed: 42
resume_from: null
require_cuda: false

train:
  progress:
    type: rich
    update_interval_seconds: 15.0

logging:
  use_wandb: false
  wandb_project: spectra-mtl
  wandb_mode: offline

output_dir: "./outputs/${run_name}"

# Keep Hydra outputs in the stable artifact directory.
hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: ${output_dir}
    subdir: ${hydra.job.override_dirname}
