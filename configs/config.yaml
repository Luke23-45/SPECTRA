defaults:
  - dataset: synthetic
  - method: pcgrad
  - _self_

# ─── Experiment Metadata ──────────────────────────────────────
run_name: "${method_name}_${dataset_name}_s${seed}"
seed: 42

# ─── Logging ─────────────────────────────────────────────────
logging:
  use_wandb: false
  wandb_project: spectra-mtl
  wandb_mode: offline

# ─── Output ──────────────────────────────────────────────────
output_dir: "./outputs/${run_name}"
