defaults:
  - dataset: synthetic
  - method: pcgrad
  - _self_

# ─── Experiment Metadata ──────────────────────────────────────
method_name: "${method.name}"
run_name: "${method_name}_${dataset_name}_s${seed}"
seed: 42
resume_from: null
require_cuda: false

# ─── Logging ─────────────────────────────────────────────────
logging:
  use_wandb: false
  wandb_project: spectra-mtl
  wandb_mode: offline

# ─── Output ──────────────────────────────────────────────────
output_dir: "./outputs/${run_name}"

# ─── Hydra Configuration ───────────────────────────────────────
# Disable Hydra's timestamped subdir to use stable artifact dir directly
hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: ${output_dir}
    subdir: ${hydra.job.override_dirname}
