# @package _global_
# ─── PCGrad (Yu et al. 2020) ─────────────────────────────────
method_name: pcgrad
use_alb: false

method:
  name: pcgrad

# Overrides the `engine` block of whatever Domain Silo is currently active
module:
  engine:
    _target_: spectra.engine.optimizers.PCGradEngine

train:
  grad_clip: 1.0  # Safe boundary during PCGrad geometric recalibration
  early_stop_patience: 15  # [TUG-OF-WAR FIX] PCGrad's projected gradients create
                           # noisier val loss trajectories than standard methods.
                           # Default patience=10 triggers premature stopping.
