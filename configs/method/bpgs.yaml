# @package _global_
method_name: bpgs
use_alb: false

method:
  name: bpgs
  temperature: 2.0 # Retained for compatibility (not used in network_loss)
  kappa: 0.1       # Anti-Kendall exponent: mild hard-task focus (κ=0 is Kendall, κ=0.1 is near-balanced)

module:
  engine:
    _target_: spectra.engine.optimizers.BPGSEngine

train:
  grad_clip: 1.0
  precision: 32
