# @package _global_
method_name: bpgs
use_alb: false

method:
  name: bpgs
  s_min: -10.0
  s_max: 10.0
  s_init: 0.0
  unc_mode: log_mse  # options: kendall | log_mse | huber_log
  eps_target: 1.0e-6

module:
  engine:
    _target_: spectra.engine.optimizers.BPGSEngine

train:
  grad_clip: 1.0
  precision: 32
