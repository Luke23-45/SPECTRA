# ─── B-PGS Only (No ALB — For Dense Prediction / NYUv2) ──────
name: bpgs

# B-PGS parameters (Locked v3.0 Specs)
use_sigmoid: true
use_autocal: true
s_min: -5.0
s_max: 10.0
ema_decay: 0.99

# ALB disabled for dense prediction (SegNet backbone)
# ALB requires temporal [B, T, C] input — incompatible with [B, C, H, W]
use_alb: false
