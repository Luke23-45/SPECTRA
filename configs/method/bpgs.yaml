# @package _global_
method_name: bpgs
use_alb: false

method:
  name: bpgs
  temperature: 2.0 # Softmax temperature for precision-softmax scale equalization
  kappa: 0.3       # Anti-Kendall exponent: shifts equilibrium from UWSO to hard-task mining

module:
  engine:
    _target_: spectra.engine.optimizers.BPGSEngine

train:
  grad_clip: 1.0
  precision: 32
