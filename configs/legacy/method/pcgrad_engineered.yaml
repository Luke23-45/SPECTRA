# @package _global_
# ─── PCGrad (Yu et al. 2020) ─────────────────────────────────
method_name: pcgrad

method:
  name: pcgrad

# Overrides the `engine` block of whatever Domain Silo is currently active
module:
  engine:
    _target_: spectra.engine.optimizers.PCGradEngine

train:
  grad_clip: 1.0  # Safe boundary during PCGrad geometric recalibration
  # [FAIRNESS FIX] early_stop_patience removed — uses global default (20) for all methods.
