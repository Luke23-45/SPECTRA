defaults:
  - dataset: nyuv2
  - method: bpgs
  - _self_

# ─── Experiment Metadata ──────────────────────────────────────
run_name: "${method.name}_${dataset_name}_s${seed}"
seed: 42

# ─── Model Architecture ──────────────────────────────────────
model:
  backbone: segnet
  input_channels: 3
  d_model: 64

# ─── Tasks (now globally injected by dataset config) ──────────────

# ─── Training Hyperparameters ────────────────────────────────
train:
  epochs: 200
  batch_size: 2           # NYUv2 images are large (288×384) — GPU memory constraint
  lr: 0.0005              # Dense prediction converges well at 5e-4
  min_lr: 0.000001
  warmup_steps: 100
  weight_decay: 0.0001
  grad_clip: 1.0
  precision: 32
  num_workers: 2
  log_every_n_steps: 10

# ─── Logging ─────────────────────────────────────────────────
logging:
  use_wandb: false
  wandb_project: spectra-mtl
  wandb_mode: offline

# ─── Output ──────────────────────────────────────────────────
output_dir: "./outputs/${run_name}"
