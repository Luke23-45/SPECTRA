# @package _global_
defaults:
  - override /family: imbalance
  - override /methods: multiclass
  - _self_

experiment:
  name: exp_03_imbalance_robustness
  description: Robustness analysis under scale and label imbalance.
  generator:
    n_samples: 1024
    input_dim: 20
    shared_dim: 16
    task_count: 4
    correlation: 0.15
    imbalance_ratio: 10.0
    label_noise: 0.1
    task_type_mix: mixed
    train_fraction: 0.8
    seed: 42
    batch_size: 64
    regression_bias_scale: 0.25
    classification_temperature: 1.0
    multiclass_num_classes: 3
