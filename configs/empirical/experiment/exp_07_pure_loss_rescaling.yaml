# @package _global_
defaults:
  - override /family: rescaling
  - override /methods: multiclass
  - _self_

experiment:
  name: exp_07_pure_loss_rescaling
  description: Pure post-hoc loss-rescaling stress with fixed underlying targets.
  generator:
    n_samples: 1536
    input_dim: 24
    shared_dim: 20
    task_count: 5
    correlation: 0.3
    imbalance_ratio: 1.0
    label_noise: 0.08
    task_type_mix: mixed
    train_fraction: 0.8
    seed: 42
    batch_size: 64
    regression_bias_scale: 0.2
    classification_temperature: 1.0
    multiclass_num_classes: 6
  training_stress:
    loss_scale_task: task_reg_mse
    loss_scale_multiplier: 1.0
