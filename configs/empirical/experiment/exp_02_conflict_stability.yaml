# @package _global_
defaults:
  - override /family: conflict
  - override /methods: stability
  - _self_

experiment:
  name: exp_02_conflict_stability
  description: Stability analysis under explicit task conflict.
  generator:
    n_samples: 1024
    input_dim: 20
    shared_dim: 16
    task_count: 4
    correlation: -0.75
    imbalance_ratio: 1.0
    label_noise: 0.05
    task_type_mix: mixed
    train_fraction: 0.8
    seed: 42
    batch_size: 64
    regression_bias_scale: 0.25
    classification_temperature: 1.0
    multiclass_num_classes: 3
