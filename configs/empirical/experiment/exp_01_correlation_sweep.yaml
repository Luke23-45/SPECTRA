# @package _global_
defaults:
  - override /family: correlation
  - override /methods: boundedness
  - _self_

experiment:
  name: exp_01_correlation_sweep
  description: Boundedness validation across correlation regimes.
  generator:
    n_samples: 1024
    input_dim: 20
    shared_dim: 16
    task_count: 4
    correlation: 0.0
    imbalance_ratio: 1.0
    label_noise: 0.0
    task_type_mix: mixed
    train_fraction: 0.8
    seed: 42
    batch_size: 64
    regression_bias_scale: 0.25
    classification_temperature: 1.0
    multiclass_num_classes: 3
