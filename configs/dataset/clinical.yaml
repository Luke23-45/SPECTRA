# configs/dataset/clinical.yaml
# Axe v3.2: Standardized Clinical Benchmark Configuration

name: clinical
dataset_dir: "datasets/sepsis_clinical_28"
hf_repo: "hellxhell/sepsis-clinical-28"
sepsis_boost: 10.0
sampler_target: outcome
subset_pct: 1.0  # CPM: Subsetting for fast piloting (1.0 = Full Benchmark)

# ─── Model Overrides (Expert Clinical Spec) ───────────────────
model:
  backbone: shared_trunk
  input_dim: 28           # Standard Clinical 28
  d_model: 512            # Higher capacity for clinical latent space
  hidden_layers: 4        # Deeper shared trunk
  dropout: 0.2

# ─── Task Definitions (Standardized Schema) ───────────────────
tasks:
  - name: outcome
    type: classification
    loss: bce
    num_classes: 1        # Binary classification
    manifold: expert      # High-freq discriminative signal
    weight: 1.0
    pos_weight: 3.0        # ~3% positives => stronger positive gradient

  - name: phase
    type: classification
    loss: cross_entropy
    num_classes: 3        # Stable, Pre-Shock, Shock
    manifold: planner     # Smooth, slow-moving trajectory
    weight: 1.0

# ─── Training Hyperparameters (Axe v3.2 Clinical) ─────────────
train:
  epochs: 100
  batch_size: 64         # Standard for clinical time-series
  lr: 0.0001              # Stable learning rate
  min_lr: 0.000001
  warmup_steps: 300
  weight_decay: 0.0001
  grad_clip: 2.0
  precision: "16-mixed"  # Speed up training
  log_every_n_steps: 10

  early_stop: true
  early_stop_patience: 3
  early_stop_min_delta: 0.001
