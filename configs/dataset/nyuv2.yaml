# @package _global_
# configs/dataset/nyuv2.yaml
# Dataset configuration for NYUv2 multi-task dense prediction benchmark.

dataset_name: nyuv2
benchmark: nyuv2
root: "datasets/nyuv2_lmdb"
augmentation: true
normalize_rgb: false
subset_pct: 1.0
subset_seed: 42
num_classes: 13
ignore_index: 255
image_height: 288
image_width: 384
train_size: 795
val_size: 654

# Backward-compatible nested runtime fields for utilities that still inspect
# cfg.dataset.* instead of top-level @package _global_ values.
dataset:
  name: nyuv2
  benchmark: nyuv2
  root: ${root}
  augmentation: ${augmentation}
  normalize_rgb: ${normalize_rgb}
  subset_pct: ${subset_pct}
  subset_seed: ${subset_seed}
  num_classes: ${num_classes}
  ignore_index: ${ignore_index}
  image_height: ${image_height}
  image_width: ${image_width}
  train_size: ${train_size}
  val_size: ${val_size}

module:
  _target_: spectra.modules.VisionSPECTRAModule
  engine:
    _target_: spectra.engine.optimizers.StandardEngine

model:
  backbone: segnet
  input_channels: 3
  d_model: 64
  n_heads: 4
  dropout: 0.1

tasks:
  - name: segmentation
    type: dense_classification
    loss: cross_entropy
    num_classes: 13
    ignore_index: 255
    manifold: planner
    weight: 1.0

  - name: depth
    type: dense_regression
    loss: masked_l1
    output_dim: 1
    manifold: planner
    weight: 1.0

  - name: normals
    type: dense_regression
    loss: cosine_dense
    output_dim: 3
    manifold: expert
    weight: 1.0

train:
  save_ckpt: true
  epochs: 200
  batch_size: 2
  lr: 0.0005
  min_lr: 0.000001
  warmup_steps: 100
  weight_decay: 0.0001
  grad_clip: 1.0
  precision: 32
  num_workers: 2
  log_every_n_steps: 10
  deterministic: false
  early_stop: true
  early_stop_patience: 10
  early_stop_min_delta: 0.0001

logging:
  use_wandb: false
  wandb_project: spectra-mtl
  wandb_mode: offline
