name: 05_nyuv2_full_final
group: optional
kind: training
description: Optional final full NYUv2 seeded comparison for the paper table.
notes: High-cost validation study. Run only when NYUv2 is available and the core synthetic story is already locked.
variants:
  - label: static
    dataset: nyuv2
    method: static
    epochs: 120
    seeds: [42, 43, 44]
    extra_overrides:
      - resume_from=auto
      - batch_augmentation=cpu
      - train.deterministic=true
      - train.deterministic_warn_only=false
      - train.save_ckpt=true
      - train.checkpoint_every_minutes=30
      - train.selection_metric=val/miou
      - train.selection_mode=max
      - train.progress.type=minimal
      - train.progress.update_interval_seconds=15
    early_stop: true
    early_stop_patience: 15
    early_stop_min_delta: 0.0001
