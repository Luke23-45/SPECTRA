    dataset: rf1
    method: static
    epochs: 120
    seeds: [42, 43, 44]
    early_stop: true
    early_stop_patience: 15
    early_stop_min_delta: 0.0001
  - label: uwso
    dataset: rf1
    method: uwso
    epochs: 120
    seeds: [42, 43, 44]
    early_stop: true
    early_stop_patience: 15
    early_stop_min_delta: 0.0001
  - label: bpgs
    dataset: rf1
    method: bpgs
    epochs: 120
    seeds: [42, 43, 44]
    early_stop: true
    early_stop_patience: 15
    early_stop_min_delta: 0.0001
